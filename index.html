function openSheet(html, keepScroll){
  var box = $('sheetBody');
  var at = keepScroll ? box.scrollTop : 0;
  box.innerHTML = html;
  $('sheet').classList.add('on');
  if (keepScroll) box.scrollTop = at;
}
function closeSheet(){ $('sheet').classList.remove('on'); }

function showAdd(){
  openSheet('<h3>Add an exercise</h3><div class="sub">Numbers come from your last session.</div>' +
    '<input id="axq" class="f" placeholder="Search or type a new name" autocomplete="off">' +
    '<div id="axl"></div><button class="close" data-close="1">Close</button>');
  $('axq').addEventListener('input', axList);
  axList();
}
function axList(){
  var raw = $('axq') ? $('axq').value.trim() : '';
  var q = norm(raw);
  var list = (DATA.exercises||[]).filter(function(e){ return !q || e.key.indexOf(q) !== -1; }).slice(0, 30);
  var h = list.map(function(e){
    var lbl = planLabel(buildRows(e.key, 0));
    return '<div class="hrow2"><span class="s" style="flex:1">' + esc(e.name) +
      '<br><span style="font-size:11px;color:var(--dim)">' + esc(lbl) + '</span></span>' +
      '<button class="mini" data-pick="' + esc(e.name) + '">add</button></div>';
  }).join('');
  if (raw && !(DATA.exercises||[]).some(function(e){ return e.key === q; })){
    h += '<div class="hrow2"><span class="s" style="flex:1">Create “' + esc(raw) + '”</span>' +
         '<button class="mini" data-pick="' + esc(raw) + '">add</button></div>';
  }
  $('axl').innerHTML = h || '<div class="sub" style="padding-top:10px">Nothing matches.</div>';
}

var DIAG = null;

function showDiag(){
  if (!DIAG){
    openSheet('<h3>Sheet status</h3><div class="sub">Checking…</div>');
    google.script.run
      .withSuccessHandler(function(d){ DIAG = d; showDiag(); })
      .withFailureHandler(function(){ DIAG = { repair:null, integrity:null }; showDiag(); })
      .diagnostics();
    return;
  }
  var st = (DATA && DATA.status) || {};
  function line(label, val, warn){
    return '<div class="hrow2"><span class="s" style="flex:1">' + esc(label) + '</span>' +
           '<span class="e"' + (warn ? ' style="color:var(--amber)"' : '') + '>' + esc(val) + '</span></div>';
  }
  var h = '<h3>Sheet status</h3><div class="sub">Where your data actually is right now.</div>';
  h += line('App version', st.version || '?');
  h += line('Log rows (one per set)', st.logRows === -1 ? 'no Log tab' : st.logRows,
            !st.logRows || st.logRows < 1);
  h += line('Sessions rows', st.sessionRows === -1 ? 'no Sessions tab' : st.sessionRows);
  h += line('Training rows (routines)', st.programRows === -1 ? 'no Training tab' : st.programRows);
  h += line('Exercises with history', (DATA.exercises||[]).length, !(DATA.exercises||[]).length);
  h += line('Warm-up configured', warmRoutine() ? 'yes' : 'no', !warmRoutine());
  var ig = DIAG && DIAG.integrity;
  if (ig){
    h += line('Log rows check', ig.healthy ? 'looks right' : ig.badId + ' rows with a wrong ID',
              !ig.healthy);
    if (!ig.healthy && ig.badVolume) h += line('Volume mismatches', ig.badVolume, true);
    h += line('Logged in the app so far', ig.loggedInApp);
  }
  var rp = DIAG && DIAG.repair;
  if (rp && rp.groups) h += line('Under-recorded old sessions', rp.groups + ' to review', true);
  if (rp && rp.voidGroups) h += line('Exercises marked not done', rp.voidGroups + ' to remove', true);
  h += '<div class="sub" style="margin-top:14px">Tabs: ' + esc((st.sheets||[]).join(', ')) + '</div>';
  h += '<div class="sub">Rest between sets is column K of the Log tab, in seconds.</div>';
  var btns = [];
  if (rp && (rp.groups || rp.voidGroups))
    btns.push('<button class="plate" data-repair="1" style="border-color:var(--amber);color:var(--amber)">Review history fixes</button>');
  btns.push('<button class="plate" data-selftest="1">Run the self test</button>');
  btns.push('<button class="plate" data-backfill="1">Recalculate all rest times</button>');
  btns.push('<button class="plate" data-sortlog="1">Tidy the Log order</button>');
  h += '<div class="plates">' + btns.join('') + '</div>';
  openSheet(h + '<button class="close" data-close="1">Close</button>');
}

/** Shows what the repair would do, before it does anything. */
function showSelfTest(r){
  var h = '<h3>' + (r.ok ? 'Everything works' : 'Something is wrong') + '</h3>' +
    '<div class="sub">A throwaway set is written, read back and deleted. ' +
    'If logging is broken, the step that fails tells you where.</div>';
  r.steps.forEach(function(s){
    h += '<div class="hrow2"><span class="d" style="color:' +
         (s.ok ? 'var(--green)' : 'var(--red)') + '">' + (s.ok ? 'ok' : 'FAIL') + '</span>' +
         '<span class="s" style="flex:1;font-family:Inter,sans-serif;font-size:12px">' +
         esc(s.name) + '<br><span style="color:var(--dim)">' + esc(s.result) + '</span></span></div>';
  });
  openSheet(h + '<button class="close" data-close="1">Close</button>');
}

function showRepair(){
  var rp = DIAG && DIAG.repair;
  if (!rp || (!rp.groups && !rp.voidGroups)){ toast('Nothing to fix.'); return; }
  var h = '<h3>History fixes</h3>';
  if (rp.groups){
    h += '<div class="sub">On these days you filled in one set but wrote how many you really did. ' +
      'Copying that set out to the number your note claims would add <b>' + rp.setsToAdd +
      '</b> sets across <b>' + rp.groups + '</b> exercises. ' +
      'Added rows carry no time, so they never invent rest values, and each one says where it came from. ' +
      'Nothing already recorded is changed.</div>';
  }
  rp.items.slice(0, 12).forEach(function(f){
    h += '<div class="hrow2"><span class="d">' + esc(shortDate(f.date)) + '</span>' +
         '<span class="s" style="flex:1">' + esc(f.name) +
         '<br><span style="font-size:11px;color:var(--dim)">' +
         esc(f.reps + (f.weight === '' ? '' : ' × ' + fmtW(f.weight))) + ' &nbsp;·&nbsp; “' +
         esc(String(f.note).slice(0,40)) + '”</span></span>' +
         '<span class="e">' + f.logged + ' → ' + f.declared + '</span></div>';
  });
  if (rp.items.length > 12)
    h += '<div class="sub" style="margin-top:10px">and ' + (rp.items.length - 12) + ' more</div>';
  h += '<div class="plates" style="margin-top:14px">' +
    (rp.setsToAdd ? '<button class="plate" data-dorepair="1" style="border-color:var(--amber);color:var(--amber)">Add the ' +
      rp.setsToAdd + ' sets</button>' : '') +
    (rp.rowsToDrop ? '<button class="plate" data-dovoid="1" style="border-color:var(--red);color:var(--red)">Remove the ' +
      rp.rowsToDrop + ' skipped rows</button>' : '') +
    '<button class="plate" data-close="1">Leave it</button></div>';

  if (rp.voids && rp.voids.length){
    h += '<div class="sub" style="margin-top:18px">Marked “didn’t do”: ' + rp.voidGroups +
         ' exercises, ' + rp.rowsToDrop + ' rows. These were copied in from your routine ' +
         'and never performed, so every set on that exercise that day is removed.</div>';
    rp.voids.slice(0, 10).forEach(function(v){
      h += '<div class="hrow2"><span class="d">' + esc(shortDate(v.date)) + '</span>' +
           '<span class="s" style="flex:1">' + esc(v.name) + '</span>' +
           '<span class="e">' + v.rows + ' row' + (v.rows > 1 ? 's' : '') + '</span></div>';
    });
    if (rp.voids.length > 10)
      h += '<div class="sub" style="margin-top:8px">and ' + (rp.voids.length - 10) + ' more</div>';
  }
  openSheet(h);
}

function showHistory(key){
  var e = exFor(key);
  if (!e) { toast('No history yet'); return; }
  var h = '<h3>' + esc(e.name) + '</h3><div class="sub">' + e.count + ' sessions' +
    (e.best ? ' · best ' + esc(e.best.reps + ' × ' + fmtW(e.best.weight)) + ' on ' + esc(shortDate(e.best.date)) : '') +
    '</div>';
  e.recent.forEach(function(s){
    var top = null;
    s.sets.forEach(function(st){ var v = e1rm(st.weight, st.reps); if (v !== null && (top === null || v > top)) top = v; });
    // Each set with the rest that came before it, so a variable session reads correctly.
    var seq = s.sets.map(function(st, i){
      var r = (i > 0 && st.rest) ? '<span class="gapin">' + esc(mmss(st.rest)) + '</span>' : '';
      var w = st.work ? '<span class="workin">' + esc(mmss(st.work)) + '</span>' : '';
      return r + esc(setStr(st)) + w;
    }).join('');
    h += '<div class="hrow2"><span class="d">' + esc(shortDate(s.date)) + '</span>' +
         '<span class="s">' + seq + '</span>' +
         '<span class="e">' + (top !== null ? 'e1RM ' + Math.round(top) : '') + '</span></div>';
  });
  var notes = [];
  e.recent.forEach(function(s){ s.sets.forEach(function(st){
    if (st.note) notes.push(shortDate(s.date) + ': ' + st.note);
  }); });
  if (notes.length){
    h += '<div class="sub" style="margin-top:14px">Notes</div>';
    notes.slice(0,6).forEach(function(t){ h += '<div class="hrow2"><span style="font-size:12px">' + esc(t) + '</span></div>'; });
  }
  openSheet(h + '<button class="close" data-close="1">Close</button>');
}

function showPlates(key){
  var it = itemFor(key), target = 0;
  var card = sel(key);
  if (card){
    var inputs = card.querySelectorAll('.f-w');
    for (var i=inputs.length-1;i>=0;i--){ var v = n(inputs[i].value); if (v){ target = v; break; } }
  }
  openSheet('<h3>Plate loading</h3><div class="sub">' + esc(it ? it.name : '') + '</div>' +
    '<div class="fieldrow"><label>Target</label><input id="plTarget" class="num" value="' + target + '">' +
    '<label>Bar</label><input id="plBar" class="num" value="45"></div>' +
    '<div class="plates" id="plOut"></div><button class="close" data-close="1">Close</button>');
  calcPlates();
  $('plTarget').addEventListener('input', calcPlates);
  $('plBar').addEventListener('input', calcPlates);
}
function calcPlates(){
  var target = n($('plTarget').value) || 0;
  var bar = n($('plBar').value) || 0;
  var per = (target - bar) / 2;
  var out = $('plOut');
  if (per < 0){ out.innerHTML = '<span class="plate">Below bar weight</span>'; return; }
  var left = per, parts = [];
  [45,35,25,10,5,2.5].forEach(function(s){
    var c = Math.floor(left / s);
    if (c > 0){ parts.push(c + ' × ' + s); left = Math.round((left - c*s)*100)/100; }
  });
  var h = parts.map(function(p){ return '<span class="plate">' + p + '</span>'; }).join('');
  h += '<span class="plate" style="color:var(--dim)">' + (Math.round(per*100)/100) + ' per side</span>';
  if (left > 0.01) h += '<span class="plate" style="color:var(--red)">' + left + ' short</span>';
  out.innerHTML = h || '<span class="plate">Bar only</span>';
}

function showTimer(key){
  var cur = restFor(key);
  var h = '<h3>Rest for this exercise</h3><div class="sub">Starts automatically after each working set</div><div class="plates">';
  [60,90,120,150,180,240,300].forEach(function(o){
    h += '<button class="plate" data-setrest="' + esc(key) + '" data-sec="' + o + '"' +
         (o === cur ? ' style="border-color:var(--amber);color:var(--amber)"' : '') + '>' + (o/60) + ' min</button>';
  });
  openSheet(h + '</div><button class="close" data-close="1">Close</button>');
}

/* ------------------------------------------------------------------ events */
document.addEventListener('click', function(ev){
  if (!ev.target.closest) return;
  var t = ev.target.closest('[data-tick],[data-cycle],[data-copy],[data-kill],[data-addrow],' +
    '[data-droprow],[data-collapse],[data-open],[data-hist],[data-plates],[data-timer],[data-skip],' +
    '[data-start],[data-repeat],[data-adj],[data-close],[data-setrest],[data-routines],[data-add],' +
    '[data-finish],[data-finishnow],[data-tickall],[data-pick],[data-tab],[data-redit],'+
    '[data-warmall],[data-warmclear],[data-hold],[data-seedwarm],[data-diag],'+
    '[data-repair],[data-dorepair],[data-dovoid],[data-selftest],[data-backfill],[data-sortlog],'+
    '[data-rnew],[data-rrm],[data-rup],' +
    '[data-rsave],[data-rback],[data-rdel],[data-raddnew],' +
    '[data-wsave],[data-wrange],[data-wdel],#restStop');
  if (!t) return;
  var d = t.dataset || {};

  if (d.wsave) return saveWeightEntry(t);
  if (d.wrange){ WRANGE = d.wrange; ls('tl_wrange', WRANGE); return renderWeight(); }
  if (d.wdel) return deleteWeightEntry(d.wdel);

  if (t.id === 'restStop') return rest.working ? cancelWork() : stopRest();
  if (d.tab){ TAB = d.tab; return renderApp(); }
  if (d.close) return closeSheet();
  if (d.add){ return showAdd(); }
  if (d.pick){ addExercise(d.pick, 0); closeSheet(); TAB = 'log'; return renderApp(); }
  if (d.finish) return confirmFinish();
  if (d.finishnow) return finishSession();
  if (d.tickall) return tickAllPending();
  if (d.start) return startRoutine(d.start);
  if (d.repeat) return startFromSession(d.repeat);
  if (d.routines) return showRoutines(true);
  if (d.setrest){ setRestFor(d.setrest, Number(d.sec)); closeSheet(); renderApp(); return; }
  if (d.adj){
    if (!S.rest) return;
    S.rest.target = Math.max(30, S.rest.target + Number(d.adj));
    S.rest.beeped = restElapsed() >= S.rest.target;
    store();
    $('rwho').textContent = (S.rest.label ? S.rest.label + ' · ' : '') + 'target ' + mmss(S.rest.target);
    paintRest();
    return;
  }
  if (d.seedwarm){
    t.textContent = 'Adding…';
    google.script.run
      .withSuccessHandler(function(){ reload(function(){ toast('Warm-up added.'); }); })
      .withFailureHandler(function(){ toast('Could not add the warm-up.'); renderApp(); })
      .seedWarmup();
    return;
  }
  if (d.warmall) return warmAll(true);
  if (d.warmclear) return warmAll(false);
  if (d.hold){
    var hit = itemFor(d.hold);
    startRest(Number(d.sec) || 60, (hit ? hit.name : 'Hold'));
    return;
  }
  if (d.tick) return toggleSet(d.tick, Number(d.i));
  if (d.cycle) return cycleType(d.cycle, Number(d.i));
  if (d.copy) return copyPrev(d.copy, Number(d.i));
  if (d.skip) return skipExercise(d.skip);
  if (d.kill) return removeExercise(d.kill);
  if (d.addrow) return addRow(d.addrow);
  if (d.droprow) return dropRow(d.droprow);
  if (d.collapse){ var a = itemFor(d.collapse); if (a){ a.open = false; store(); renderApp(); } return; }
  if (d.open){ var b = itemFor(d.open); if (b){ b.open = true; store(); renderApp(); } return; }
  if (d.diag) return showDiag();
  if (d.sortlog){
    t.textContent = 'Sorting…';
    google.script.run
      .withSuccessHandler(function(res){
        closeSheet();
        toast('Log sorted by date, session and time: ' + (res && res.rows) + ' rows.');
      })
      .withFailureHandler(function(){ toast('Could not sort.'); renderApp(); })
      .sortLog();
    return;
  }
  if (d.backfill){
    t.textContent = 'Working…';
    google.script.run
      .withSuccessHandler(function(res){
        DIAG = null;
        closeSheet();
        reload(function(){
          toast('Rest recalculated across ' + (res && res.rows) + ' sets. ' +
                (res && res.filled) + ' now carry a value.');
        });
      })
      .withFailureHandler(function(){ toast('Could not recalculate.'); renderApp(); })
      .backfillRest();
    return;
  }
  if (d.selftest){
    t.textContent = 'Testing…';
    google.script.run
      .withSuccessHandler(showSelfTest)
      .withFailureHandler(function(e){ toast('Self test could not run: ' + (e && e.message)); })
      .selfTest();
    return;
  }
  if (d.repair) return showRepair();
  if (d.dovoid){
    t.textContent = 'Working…';
    google.script.run
      .withSuccessHandler(function(res){
        DIAG = null;
        closeSheet();
        reload(function(){
          toast('Removed ' + (res && res.removed) + ' rows from ' + (res && res.groups) + ' skipped exercises.');
        });
      })
      .withFailureHandler(function(){ toast('Could not remove them.'); renderApp(); })
      .applyVoidRemoval();
    return;
  }
  if (d.dorepair){
    t.textContent = 'Working…';
    google.script.run
      .withSuccessHandler(function(res){
        DIAG = null;
        closeSheet();
        reload(function(){
          toast('Added ' + (res && res.added) + ' sets across ' + (res && res.groups) + ' exercises.');
        });
      })
      .withFailureHandler(function(){ toast('Could not apply the fix.'); renderApp(); })
      .applySetRepair();
    return;
  }
  if (d.hist) return showHistory(d.hist);
  if (d.plates) return showPlates(d.plates);
  if (d.timer) return showTimer(d.timer);

  if (d.redit) return showRoutine(Number(d.redit));
  if (d.raddnew) return addToRoutine($('rnewex') ? $('rnewex').value : '');
  if (d.rback) return showRoutines(false);
  if (d.rsave) return saveRoutines();
  if (d.rnew){
    if (!EDIT) EDIT = cloneProgram();
    EDIT.push({ day:'Day ' + (EDIT.length + 1), items:[], lastDate:'' });
    return showRoutine(EDIT.length - 1);
  }
  if (d.rdel){
    syncEditor();
    var gone = EDIT[EDITI] ? EDIT[EDITI].day : '';
    EDIT.splice(EDITI, 1);
    EDITI = -1;
    return persistRoutines(function(){
      showRoutines(false);
      toast(gone ? gone + ' deleted' : 'Routine deleted');
    });
  }
  if (d.rrm){ syncEditor(); EDIT[EDITI].items.splice(Number(d.rrm), 1); return showRoutine(EDITI); }
  if (d.rup){
    syncEditor();
    var j = Number(d.rup), arr = EDIT[EDITI].items;
    if (j > 0){ var tmp = arr[j-1]; arr[j-1] = arr[j]; arr[j] = tmp; }
    return showRoutine(EDITI);
  }
});

$('sheet').addEventListener('click', function(ev){ if (ev.target === this) closeSheet(); });

/**
 * Editing a set you have already logged has to reach the sheet too. Typing an
 * effort score after ticking the set is the common case. Debounced so a call
 * does not fire on every keystroke.
 */
var editTimers = {};
function pushSoon(it){
  clearTimeout(editTimers[it.key]);
  editTimers[it.key] = setTimeout(function(){
    delete editTimers[it.key];
    if (itemFor(it.key)) push(it);          // still in this session
  }, 700);
}

/* keep typed values in state without re-rendering, which would steal focus */
document.addEventListener('input', function(ev){
  if (!ev.target.closest) return;
  var wrow = ev.target.closest('.wrow');
  if (wrow){
    var wit = itemFor(wrow.dataset.key);
    if (!wit) return;
    var wsibs = Array.prototype.filter.call(
      wrow.parentNode.querySelectorAll('.wrow'),
      function(x){ return x.dataset.key === wrow.dataset.key; });
    var wi = Array.prototype.indexOf.call(wsibs, wrow);
    var wr = wit.rows[wi];
    if (!wr) return;
    var wv = wrow.querySelector('.f-w').value.trim();
    var rv2 = wrow.querySelector('.f-r').value.trim();
    wr.w = (wv === '' ? '' : (n(wv) === null ? wv : n(wv)));
    wr.r = (rv2 === '' ? '' : (n(rv2) === null ? rv2 : n(rv2)));
    wr.t = true;
    store();
    if (wr.done) pushSoon(wit);
    return;
  }
  var card = ev.target.closest('.card');
  if (!card || !card.dataset.key) return;
  var it = itemFor(card.dataset.key);
  if (!it) return;
  if (ev.target.classList.contains('f-note')){ it.note = ev.target.value; store(); return; }
  var gr = ev.target.closest('.gr');
  if (!gr) return;
  var idx = Array.prototype.indexOf.call(card.querySelectorAll('.gr'), gr);
  var row = it.rows[idx];
  if (!row) return;
  if (it.kind === 'cardio'){
    var mv = gr.querySelector('.f-dur').value.trim();
    row.dur = mv === '' ? '' : Math.round((n(mv) || 0) * 60);
    row.hr = gr.querySelector('.f-hr').value.trim();
    row.inc = gr.querySelector('.f-inc').value.trim();
  } else {
    var wv = gr.querySelector('.f-w').value.trim();
    var rv = gr.querySelector('.f-r').value.trim();
    row.w = (wv === '' ? '' : (n(wv) === null ? wv : n(wv)));
    row.r = (rv === '' ? '' : (n(rv) === null ? rv : n(rv)));
    row.rpe = gr.querySelector('.f-rpe').value.trim();
  }
  row.t = true;
  gr.classList.add('typed');
  store();
  if (row.done) pushSoon(it);
});

$('date').addEventListener('change', function(){
  S.date = this.value;
  if (!S.items.length) S.session = nextSessionFor(S.date);
  store(); renderApp();
});
